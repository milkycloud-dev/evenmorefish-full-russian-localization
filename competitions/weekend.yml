# The default weekend competition.
# See _example.yml for all options.

id: weekendCompetition
disabled: true
type: RANDOM
random-selection:
- LARGEST_FISH
- MOST_FISH
- LARGEST_TOTAL
duration: 60
minimum-players: 1
days: {}
bossbar-colour: PURPLE
bossbar-prefix: '<bold><light_purple>Турнир выходного дня: '

rewards:
  '1':
  - MESSAGE:<green>Поздравляем с 1 местом! Вы получили 7500 опыта и 6 алмазов!
  - EXP:7500
  - ITEM:DIAMOND,6
  '2':
  - MESSAGE:<green>Поздравляем со 2 местом! Вы получили 5000 опыта и 4 алмаза!
  - EXP:5000
  - ITEM:DIAMOND,4
  '3':
  - MESSAGE:<yellow>Поздравляем с 3 местом! Вы получили 2500 опыта и 2 алмаза!
  - EXP:2500
  - ITEM:DIAMOND,2
  participation:
  - MESSAGE:<yellow>К сожалению, только топ-3 игроков получают награды. Повезет в следующий раз! :)
